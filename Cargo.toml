[package]
name = "puppygrad"
version = "0.1.0"
edition = "2021"

[features]
audio-formats = ["dep:claxon"]
hardware-io = ["dep:cpal", "dep:nokhwa"]

[profile.release]
lto = "fat"
codegen-units = 1

# Graph lowering and checkpoint conversion run before GPU execution, including
# during ordinary `cargo run`. Keep debugging while optimizing that startup work.
[profile.dev.package.puppygrad]
opt-level = 1

[dependencies]
clap = { version = "4", features = ["derive"] }
claxon = { version = "0.4", optional = true }
cpal = { version = "0.15", optional = true }
ctrlc = "3"
crossterm = "0.29"
flate2 = "1.1"
gemm = { version = "0.19", default-features = false, features = ["std", "rayon"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
libloading = "0.8"
libc = "0.2"
nokhwa = { version = "0.10", default-features = false, features = ["decoding", "input-native"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
rusqlite = { version = "0.32", features = ["bundled"] }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = "0.23"
unicode-segmentation = "1"
